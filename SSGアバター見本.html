<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>SSGアバター 見本</title>
<style>
  :root{--cream:#FCFAF4;--ink:#2E3A46;--muted:#8A8578;--line:#E8E0CC;--orange:#FF9614;--pink:#FF6FA5;--blue:#39B2F5;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;padding:24px;}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;font-weight:600;margin:0 0 22px}
  h2{font-size:16px;margin:26px 0 10px;padding-left:10px;border-left:5px solid var(--orange);}
  .row{display:flex;flex-wrap:wrap;gap:14px}
  .card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px;text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.05)}
  .card .nm{font-size:12px;font-weight:800;margin-top:4px}
  .card .pr{font-size:11px;font-weight:700;color:var(--orange)}
  .card .pr.free{color:#25C186}
  svg{display:block;border-radius:50%}
  /* きせかえ画面のモック */
  .phone{width:390px;background:var(--cream);border:3px solid var(--line);border-radius:26px;padding:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.10)}
  .ph-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .ph-top .big{border:4px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.12);border-radius:50%}
  .coin{background:#FFF1D6;border:2px solid #FFD98A;border-radius:14px;padding:8px 12px;font-weight:800;font-size:15px}
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .tab{padding:7px 13px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:13px}
  .tab.on{background:var(--pink);border-color:var(--pink);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .item{background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px;text-align:center}
  .item.sel{border-color:var(--pink);box-shadow:0 0 0 3px #FFE3EF}
  .item.lock{opacity:.55}
  .item .nm{font-size:11px;font-weight:800;margin-top:2px}
  .item .pr{font-size:11px;font-weight:800;color:var(--orange)}
  .item .pr.have{color:#25C186}
  .rank{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);
    border-radius:16px;padding:8px 12px;margin-bottom:8px;font-weight:800}
  .rank .no{width:26px;text-align:center;font-size:15px}
  .rank .pt{margin-left:auto;color:var(--orange)}
  .rank.me{background:#F4EEFF;border-color:#8C6BEE}
  .note{font-size:12px;color:var(--muted);font-weight:600;margin-top:8px;line-height:1.7}
</style></head>

<h1>SSG学習アプリ アバター 見本</h1>
<p class="sub">SVGで描いたパーツを重ねています。外部サービスは使わず、すべてリポジトリに入ります。</p>

<h2>組み合わせの例</h2>
<div class="row" id="samples"></div>

<h2>きせかえ画面のイメージ（スマホ）</h2>
<div class="phone">

    <div id="mockAvatar"></div>
    <div>

  <div class="tabs">

</div>

<div style="width:390px">

// アバター1体のSVGを組み立てる

  a = Object.assign({}, AVATAR_DEFAULT, a || {});
  const pick = (slot, id) => AV[slot].find(x => x.id === id) || AV[slot][0];
  const skin = pick('skin', a.skin).color;
  return `<svg viewBox="0 0 120 120" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg">`
    + pick('bg', a.bg).svg
    + `<rect x="52" y="72" width="16" height="20" rx="7" fill="${skin}"/>`
    + pick('body', a.body).svg
    + `<ellipse cx="60" cy="56" rx="26" ry="28" fill="${skin}"/>`
    + `<circle cx="35" cy="60" r="5.5" fill="${skin}"/><circle cx="85" cy="60" r="5.5" fill="${skin}"/>`
    + pick('hair', a.hair).svg + pick('face', a.face).svg
    + pick('acc', a.acc).svg + pick('hat', a.hat).svg
    + '</svg>';
}

</script>
<script>
const SLOT_JA = Object.fromEntries(AVATAR_SLOTS);

// 組み合わせの例
const samples = [
  { skin:'skin1', bg:'bg_cream',  body:'body_gym',     hair:'hair_short', face:'face_normal', hat:'hat_none', acc:'acc_none' },
  { skin:'skin1', bg:'bg_sakura', body:'body_tee',     hair:'hair_bob',   face:'face_smile',  hat:'hat_ribbon', acc:'acc_flower' },
  { skin:'skin2', bg:'bg_sky',    body:'body_hoodie',  hair:'hair_spiky', face:'face_wink',   hat:'hat_cap', acc:'acc_bandaid' },
  { skin:'skin2', bg:'bg_night',  body:'body_uniform', hair:'hair_long',  face:'face_cool',   hat:'hat_beanie', acc:'acc_glasses' },
  { skin:'skin3', bg:'bg_rainbow',body:'body_sweater', hair:'hair_twin',  face:'face_star',   hat:'hat_headphone', acc:'acc_muffler' },
  { skin:'skin1', bg:'bg_gold',   body:'body_cape',    hair:'hair_gold',  face:'face_ganbaru',   hat:'hat_crown', acc:'acc_sun' },
];
document.getElementById('samples').innerHTML = samples.map((a,i)=>
  `<div class="card">${avatarSvg(a,110)}<p class="nm">れい${i+1}</p></div>`).join('');

// きせかえモック
const me = samples[4];
document.getElementById('mockAvatar').innerHTML =
  '<div class="big" style="display:inline-block">'+avatarSvg(me,96)+'</div>';
document.getElementById('mockGrid').innerHTML = AV.hair.map(h=>{
  const owned = h.price===0 || h.id==='hair_twin';
  const sel = h.id===me.hair;
  const face = { ...me, hair:h.id, bg:'bg_cream' };
  return `<div class="item ${sel?'sel':''} ${owned?'':'lock'}">${avatarSvg(face,72)}
    <p class="nm">${h.name}</p>
    <p class="pr ${owned?'have':''}">${owned?(sel?'そうび中':'もってる'):'🪙'+h.price}</p></div>`;
}).join('');

// ランキング
[['r1',samples[4]],['r2',samples[3]],['r3',samples[1]],['r4',samples[2]]].forEach(([id,a])=>{
  document.getElementById(id).innerHTML = avatarSvg({...a},34);
});

// パーツ一覧
document.getElementById('parts').innerHTML = Object.keys(SLOT_JA).map(slot=>{
  const base = { ...AVATAR_DEFAULT };
  const items = AV[slot].map(it=>{
    const a = { ...base, [slot]: it.id };
    return `<div class="card">${avatarSvg(a,84)}<p class="nm">${it.name}</p>
      <p class="pr ${it.price===0?'free':''}">${it.price===0?'さいしょから':'🪙'+it.price}</p></div>`;
  }).join('');
  return `<h2>${SLOT_JA[slot]}</h2><div class="row">${items}</div>`;
}).join('');
</script>
</body></html>
